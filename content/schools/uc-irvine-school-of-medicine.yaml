quotes:
  arnie-shah: >-
    "UC Irvine has done a really good job creating a very collaborative class with a wide variety of
    skills and interests. Knowing everyone at your school is really different coming from a big
    university — but it feels a lot more like family."
  alexa-lucas: >-
    "I was VP of Education for the Emergency Medicine Interest Group, team leader for a global
    health/ultrasound education trip to Tanzania, and group leader for Elephant Mentors. The global
    health aspect is super unique and incredible."
  steven-tohmasi: >-
    "Each year, around 30–40 med students spend the summer between 1st and 2nd year teaching
    ultrasound internationally." Steven taught at the University of Basel in Switzerland the summer
    of 2018.
