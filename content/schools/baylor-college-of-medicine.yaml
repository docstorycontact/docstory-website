quotes:
  michele-cabeza: >-
    "Firstly, it is a huge plus that our preclinical curriculum is true Pass/Fail. This helps to make the
    environment way less competitive than schools that rank their students."
  justin: >-
    "While gunners exist, they don't actively undermine other students. We are very collaborative and love
    to relax on the weekends or at the end of the terms."

