highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Baylor's preclinical curriculum lasts just a year and a half and is **true pass/fail**. Michele
        Cabeza describes recorded morning lectures, anatomy lab, a Critical Thinking and Problem Solving
        course built on simulated cases in groups of six, and **Patient, Physician, and Society**, where
        students learn histories and physical exams before practicing in a preceptor's office.
      - >-
        Justin says the pace, not the difficulty, is the challenge, so daily review matters; students
        share class-made flashcard decks passed down and updated each year.

  - title: Texas Medical Center
    icon: local_hospital
    paragraphs:
      - >-
        Baylor sits in the Texas Medical Center, the world's largest medical center. Students train at
        **Ben Taub Hospital**, the county's Level I trauma center next to campus; **Baylor St. Luke's
        Medical Center**, Baylor's primary private adult teaching hospital; Texas Children's Hospital; and
        the Michael E. DeBakey VA Medical Center.
      - >-
        A Temple campus trains students at Baylor Scott & White Medical Center–Temple and McLane
        Children's Hospital.

  - title: Culture
    icon: groups
    paragraphs:
      - >-
        Every student joins a **Peer Resource Network**, a small group led by second-years with upperclass
        mentors, and the year starts with an overnight retreat. Classes gather for Coffeehouse talent
        shows, term-end parties, and mixers with UT McGovern.
      - >-
        Justin calls the class collaborative: people work hard but aren't too hard on themselves, and
        older students look out for younger ones. Service runs deep, starting with a first-year volunteer
        day.

  - title: Houston & Affordability
    icon: savings
    paragraphs:
      - >-
        Tuition is strikingly low for 2026–27: about **$19,700** for Texas residents and $32,800 for
        non-residents. Justin calls the low tuition "amazing."
      - >-
        Apartments are reasonably priced for a major city, and Hermann Park, the Houston Zoo, and Rice
        University sit right beside the medical center.

