highlights:
  - title: Clerkships
    icon: menu_book
    paragraphs:
      - >-
        Third year includes eight core clerkships, according to Austin Wininger: surgery, internal
        medicine, OB/GYN, psychiatry, family medicine, anesthesia, pediatrics, and neurology. Surgery,
        pediatrics, and internal medicine each last two months.
      - >-
        Most rotations end with an NBME shelf exam, and grades of Pass, High Pass, or Honors rest mostly
        on clinical evaluations and the shelf.

  - title: Nine Campuses
    icon: map
    paragraphs:
      - >-
        IUSM is one of the largest medical schools in the country, with **nine campuses** across Indiana
        and more than 1,400 medical students. Every campus hosts rotations.
      - >-
        Austin values training in both a community setting and a major city with Level I trauma.

  - title: Indianapolis Hospitals
    icon: local_hospital
    paragraphs:
      - >-
        The downtown Indianapolis campus has its own cluster of teaching hospitals: **IU Health
        Methodist** and **University** Hospitals, **Riley Hospital for Children**, Eskenazi Health (the
        county hospital), and the Roudebush VA Medical Center.
      - >-
        Austin notes the experience depends on the site: psychiatry at the VA, for example, means seeing
        many patients independently.

  - title: Research
    icon: biotech
    paragraphs:
      - >-
        IUSM drew about $233 million in NIH funding in 2025 and is home to the **Melvin and Bren Simon
        Comprehensive Cancer Center**, an NCI-designated Comprehensive Cancer Center.
      - >-
        Indiana residents with at least a 3.8 GPA and a 512 MCAT can apply through the Early Decision
        Program.

