highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Duke compresses the basic sciences into **one year**. Foundations of Patient Care runs about ten
        months and opens with a two-week immersion in history-taking, physical exam, and point-of-care
        ultrasound, so students reach clinical training in their second year.
      - >-
        Alex describes lectures that are rarely mandatory and almost always recorded, a lecture-heavy
        first semester followed by a flipped classroom in the second, and a weekly three-hour Clinical
        Skills Foundation course. A three-week Clinical Skills Intensive bridges into the wards.

  - title: The Research Year
    icon: science
    paragraphs:
      - >-
        Duke's signature third year is devoted to a **scholarly project**: bench or clinical research, or
        a dual degree. The school has kept this structure for more than 60 years, and the year is graded
        pass/fail.
      - >-
        Resources run deep: Duke reports more than **$514 million** in NIH research grants to the School
        of Medicine in 2025, and students can pair the research year with options such as an MD/MPH,
        MD/MBA, MD/JD, or MD/MPP.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        Duke Health's four hospitals anchor clinical training: **Duke University Hospital**, Duke
        Regional, Duke Raleigh, and Duke Health Lake Norman. The school counts 2,791 regular-rank faculty
        and 1,190 residents and fellows across more than 160 training programs.
      - >-
        Because students reach the wards a year early, Alex found faculty unusually accessible: in a
        class of about 115, "anyone at the medical center … is just an email away."

  - title: Life in Durham
    icon: forest
    paragraphs:
      - >-
        Alex chose Duke for its students, calling them some of the happiest on the interview trail. The
        class runs its own initiatives, from Duke Med Elementary, which brings local third graders in to
        learn an organ system each week, to a student-founded social justice group.
      - >-
        Durham offers trails and the Duke Forest within minutes, a walkable downtown, Chapel Hill 15
        minutes away and Raleigh 25, and a cost of living Alex found low enough to borrow less than
        offered.

