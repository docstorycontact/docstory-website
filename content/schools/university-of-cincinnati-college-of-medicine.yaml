highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Mornings are class and lab, and most first- and second-year classes are optional. Priya Sorab
        goes anyway, to get to know classmates and professors.
      - >-
        Afternoons vary: weekly **Learning Communities** of 12–13 students and a physician discuss cases
        and medical ethics, there's a weekly Clinical Skills session, and students shadow in fields like
        speech therapy.

  - title: Early Patient Care
    icon: stethoscope
    paragraphs:
      - >-
        Every other week, each student spends time in a physician's office seeing patients, starting in
        first year. Priya calls it the favorite part of the week.
      - >-
        Weekly Clinical Skills sessions run alongside, building history and exam skills before the
        clinical years.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        UC's academic medical center brings together **UC Medical Center**, which traces its roots to a
        teaching hospital founded in 1821, **Cincinnati Children's**, and the Cincinnati VA Medical
        Center. UC Health's West Chester Hospital adds a suburban site.
      - >-
        The class of about 170 MD students, plus 12 in the Medical Scientist Training Program, is small
        enough that Priya says classmates get to know each other really well.

  - title: Life in Cincinnati
    icon: location_city
    paragraphs:
      - >-
        Campus has a college-town feel, and downtown offers restaurants, coffee shops, and stores. After
        exams, Priya says, classmates host cookouts or head downtown.
      - >-
        Kentucky residents qualify for a metropolitan tuition rate close to Ohio in-state.

