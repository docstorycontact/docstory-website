highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Kyung Park describes mornings of in-person **Content Application Sessions** for the core basic
        science course, with afternoons largely open "white space" for studying, research, and life.
        Preclinical grading is pass/fail, and exams are NBME-style.
      - >-
        Every student spends four years on a **scholarly pursuit and thesis**, and courses in compassionate
        practice and health systems round out the curriculum.

  - title: Early Clinical Exposure
    icon: stethoscope
    paragraphs:
      - >-
        A **longitudinal integrated clerkship** places students with a family or internal medicine
        preceptor during the preclinical phase. Clinical skills sessions use standardized patients almost
        every time.
      - >-
        After the preclinical phase, 10 weeks of ungraded inpatient immersions in internal medicine,
        OB/GYN, surgery, and pediatrics let students learn before grades count.

  - title: Small Classes, Big Support
    icon: groups
    paragraphs:
      - >-
        With 60 students per class, faculty know students by name. Each student joins one of six
        **houses**, gets an upperclass "big," and works with coaches; the school has five executive and
        four academic coaches.
      - >-
        Kyung highlights a counselor dedicated to medical students and access to TCU's campus and
        football tailgates.

  - title: Fort Worth
    icon: location_city
    paragraphs:
      - >-
        Clinical partners include **JPS Health Network**, the county hospital; **Cook Children's**; Texas
        Health Resources; and Baylor Scott & White All Saints, all near the school's Medical Innovation
        District home.
      - >-
        Kyung calls Fort Worth a hidden gem: the Stockyards, West 7th, free museums, a top zoo, and Dallas
        30–40 minutes away.

