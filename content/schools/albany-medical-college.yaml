highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Ana Khatia describes recorded lectures watched on your own schedule, with a **longitudinal
        clinical skills theme** running alongside, which Ana calls the most helpful part of building
        clinical skills.
      - >-
        Instructors are easy to reach, Ana says, often jumping on a video call right away to work through
        a confusing topic.

  - title: Support
    icon: favorite
    paragraphs:
      - >-
        Ana describes a "we are all in this together" class where upperclassmen and classmates share
        resources and guidance for each theme.
      - >-
        When family emergencies hit during first year, Ana says the school was extremely understanding,
        making time for family without falling behind.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        Students train at **Albany Medical Center**, the region's academic medical center, and the Albany
        VA Medical Center. Ana found physicians hands-on with first- and second-year students, encouraging
        them to join patient interactions.
      - >-
        Albany keeps classes small on purpose, at about 145 students, from 24 states and 68 colleges.

  - title: Upstate New York
    icon: landscape
    paragraphs:
      - >-
        Albany is a smaller city with a handful of bars where you'll run into classmates, but hiking,
        lakes, skiing, and apple picking are close, and Boston and New York City are a drive or train
        ride away.
      - >-
        Ana warns winters can be brutal and dark; spring and fall make up for it.

