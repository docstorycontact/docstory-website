highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Wayne State has moved to a systems-based curriculum with NBME exams. Nik's typical day runs four
        lectures plus an anatomy review, with schedules that shift from day to day, and evenings spent
        turning lecture notes into practice questions and spaced-repetition review.
      - >-
        The pace is the shock, Nik says: what took two semesters in undergrad took two weeks in medical
        school. Seeking help early turned Nik's first weeks around.

  - title: Clinical Skills
    icon: stethoscope
    paragraphs:
      - >-
        In the **Clinical Skills** course, students learn techniques through online tutorials, then
        practice on standardized patients and get feedback from a paired classmate, the patient, and a
        fourth-year student acting as the attending.
      - >-
        Many students add volunteer clinical work, from **Street Medicine** runs to addiction clinics, and
        Nik says the class almost unanimously feels well prepared to assess patients.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        The **Detroit Medical Center** and **Henry Ford Health** are the primary teaching hospitals, and
        students train at more than 70 clinical sites, including Children's Hospital of Michigan, Detroit
        Receiving, Corewell Health Dearborn, and the John D. Dingell VA Medical Center.
      - >-
        Wayne State is also home to the **Barbara Ann Karmanos Cancer Institute**, an NCI-designated
        Comprehensive Cancer Center.

  - title: Detroit & Culture
    icon: location_city
    paragraphs:
      - >-
        Nik describes one of the most diverse student bodies anywhere, reflected in its student
        organizations and an open, relaxed environment. Downtown Detroit offers bars, restaurants, and
        class parties in Greektown.
      - >-
        Nik's unexpected support system: the building's custodians, "my biggest cheerleaders so far."

