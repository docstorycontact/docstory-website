highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Gabriel Conley describes a fast-paced curriculum built to get students into the hospital early,
        with four to five hours of lecture or required lab a day and exams about every other Friday.
        Lectures are recorded and attendance is optional.
      - >-
        Grading is Pass/Fail/Honors, and students share **Carverpedia**, a wiki of student-made study
        guides and practice questions.

  - title: Clinical Skills
    icon: stethoscope
    paragraphs:
      - >-
        The **Clinical and Professional Skills** course runs from day one, with an extensive simulated
        patient program; Gabriel estimates 50 or more sessions before the clinical years. Early Clinical
        Experiences put students in clinic with physicians several times a semester.
      - >-
        Students can complete some or all of their core clerkship year at Carver's **Des Moines** branch
        campus.

  - title: Distinction Tracks
    icon: workspace_premium
    paragraphs:
      - >-
        Students can earn up to two **distinction tracks**, in research, global health, service, teaching,
        humanities, or health care delivery, recognized at graduation and on the transcript.
      - >-
        Gabriel mentions a funded summer research fellowship after first year and global health projects
        in countries including Indonesia, Haiti, Guatemala, and South Africa.

  - title: Iowa City
    icon: location_city
    paragraphs:
      - >-
        Iowa City is a college town with a strong music and writing culture, summer festivals, one of the
        state's best farmers' markets, and trails and kayaking nearby.
      - >-
        Classes come together each spring for a **variety show** downtown, along with charity events like
        the Doc Dash 5K.

highlight_sources:
