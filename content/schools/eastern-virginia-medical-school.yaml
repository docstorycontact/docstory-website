highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Rossen Kirkov describes a first semester of morning lectures and weekly anatomy dissections, then a
        move into organ systems. Many students, including Rossen, study from board-prep resources rather
        than attending lecture.
      - >-
        Clinical skills training runs through the first two years, and students start with standardized
        patients in the **Sentara Center for Simulation and Immersive Learning**. Rossen calls the
        **ultrasound** program a real strength.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        EVMS has no hospital of its own, so students train across the region. **Sentara Norfolk General
        Hospital** is the primary teaching hospital, home to the area's only Level I trauma center and burn
        unit.
      - >-
        **Children's Hospital of The King's Daughters**, Virginia's only freestanding children's hospital,
        is the main pediatric site, and the Hampton VA Medical Center and military and community hospitals
        round out the mix.

  - title: Culture & Service
    icon: volunteer_activism
    paragraphs:
      - >-
        Rossen describes a social, friendly class with no sense of competition, and a school built around
        community service. The student-run **HOPES** clinic serves uninsured patients.
      - >-
        First-years have monthly wellness meetings, which continue less often in second year.

  - title: Norfolk & ODU
    icon: beach_access
    paragraphs:
      - >-
        EVMS joined Old Dominion University in 2024 as part of **Macon & Joan Brock Virginia Health
        Sciences**. It shows a preference for Virginia applicants, especially Hampton Roads residents.
      - >-
        Norfolk has a downtown with bars and restaurants, and the beach is about 30 minutes away.

