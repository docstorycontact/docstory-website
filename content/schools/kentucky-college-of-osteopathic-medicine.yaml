highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Classes run back to back in a single classroom, apart from Osteopathic Principles and Practices,
        with exams every four weeks. Jeremy Storck builds notes from each day's recorded lectures, turns
        them into flashcards, and then reviews.
      - >-
        Jeremy's favorite feature: dedicated internal medicine, pediatrics, OB/GYN, and surgery courses
        taught by practicing community physicians, plus mandatory clinic days for skills like suturing,
        intubation, joint injections, and chest tubes.

  - title: Rural & Appalachian Mission
    icon: landscape
    paragraphs:
      - >-
        KYCOM's stated goal is to train physicians for rural primary care in Kentucky and Appalachia, and
        its clinical sites reflect that: **Pikeville Medical Center** is the Pikeville core site, alongside
        hubs such as Hazard ARH and Highlands ARH regional medical centers.
      - >-
        Core rotations cover family medicine, internal medicine, pediatrics, surgery, women's health,
        emergency medicine, and psychiatry, with rural medicine among the selectives.

  - title: Service
    icon: volunteer_activism
    paragraphs:
      - >-
        Students practice exams and osteopathic manipulative treatment at an on-campus **OMT clinic** open
        to community members, and second-years complete clinic days each semester.
      - >-
        Each year, first-year students join a professor and the college chaplain on a two-week **mission
        trip** to deliver care in the Dominican Republic with local providers.

  - title: Life in Pikeville
    icon: hiking
    paragraphs:
      - >-
        Pikeville is a mountain town of about 6,000 in Eastern Kentucky, two hours from Lexington, with
        hiking, camping, fishing, and golf close by and few distractions from studying.
      - >-
        The highlight of the year is **Hillbilly Days**, a four-day spring festival that takes over the
        whole town, with classes off so students can join in.

