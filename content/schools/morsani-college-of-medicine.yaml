highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        USF's curriculum is organ-based, with lectures posted ahead of time and recorded; Brian James says
        only about a quarter of the class attends live. A **Doctoring** course gives steady practice with
        standardized patients, and Chetna Thawani describes scenarios from sexual-history taking to an
        interprofessional emergency simulation.
      - >-
        Every core student joins one of eleven **Scholarly Concentrations**, such as law and medicine,
        business and medicine, or nutrition and medicine, to explore an interest alongside the core
        curriculum.

  - title: Learning Communities
    icon: groups
    paragraphs:
      - >-
        Students are sorted into **Collegia**, learning communities Chetna compares to Hogwarts houses, for
        anatomy lab, doctoring groups, and friendly inter-Collegia competitions. Each has a career
        adviser, which makes it easy to get guidance from advisers and upperclassmen.
      - >-
        Both students praise how fast the school responds: a student board relays feedback on lecturers
        and exams, and faculty act on it quickly.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        **Tampa General Hospital**, a 985-bed facility with the area's only Level 1 trauma and burn unit,
        is the primary clinical training site. Students also train at the James A. Haley VA across from
        campus, Moffitt Cancer Center, and Johns Hopkins All Children's Hospital.
      - >-
        The SELECT program, which sent students to Pennsylvania's Lehigh Valley for clinical years, is being
        phased out after its graduating class of 2027.

  - title: Downtown Tampa
    icon: location_city
    paragraphs:
      - >-
        The medical school has moved downtown, near the Riverwalk, restaurants, and CAMLS, the patient
        simulation center. Brian highlights a fast-growing city with every major sport nearby: the
        Lightning a few blocks away, the Buccaneers 10 minutes, and the Rays in St. Petersburg.
      - >-
        USF has no minimum GPA or MCAT; Early Decision applicants need at least a 518 MCAT and a 3.8 GPA.

