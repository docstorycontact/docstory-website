highlights:
  - title: Curriculum & Grading
    icon: menu_book
    paragraphs:
      - >-
        The first two years open with a Foundations block, move through seven organ-system blocks, and
        end with a multisystem block. **Christian Physician Formation** and Clinical Skills Development
        run alongside them for both years.
      - >-
        A Loma Linda fourth-year describes recorded morning lectures, mostly free afternoons, and a
        remote Thursday before each Friday quiz. Preclinical blocks are **pass/fail**, with a distinction
        on the MSPE for final block scores of 88% or higher.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        Clerkships take place mainly at **Loma Linda University Medical Center**, with the Jerry L. Pettis
        Memorial VA Medical Center, Riverside University Health System's county hospital, and White
        Memorial in Los Angeles.
      - >-
        The student sees each site as a different "flavor": the county safety net, the VA's veteran
        population, and the main medical center's rare and complex transfers from across the Inland
        Empire and beyond.

  - title: Global Health & Mission
    icon: public
    paragraphs:
      - >-
        Students for International Mission Service (SIMS), part of LLU's Global Health Institute, runs
        short-term service trips during school breaks, and the school offers a **Deferred Mission
        Appointee** program for medical students.
      - >-
        The student describes summer trips in the preclinical years and fourth-year mission electives
        at Seventh-day Adventist mission hospitals abroad, where limited resources mean more patient
        education and lifestyle care.

  - title: Regional Campuses & Advising
    icon: alt_route
    paragraphs:
      - >-
        Students can choose to spend years three and four at a **regional campus**: AdventHealth Orlando
        in Florida or Kettering Health in Dayton, Ohio. The choice is made on the secondary application
        and is binding.
      - >-
        For residency applications, the student's internal medicine advising paired small groups with
        faculty mentors for personal statement review and mock interviews, alongside clerkship-run
        workshops and match data from earlier classes.

