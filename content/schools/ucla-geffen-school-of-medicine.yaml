highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Tim Ellis-Caleo describes a preclinical curriculum organized in organ-system blocks: about two hours
        of lecture a day plus afternoon sessions three days a week. Third year brings traditional core
        clerkships in medicine, family medicine, pediatrics, psychiatry, neurology, OB/GYN, and surgery.
      - >-
        UCLA doesn't require specific prerequisite courses; applicants show mastery of competency areas
        across their academic history instead.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        Tim calls clinical training UCLA's real strength: excellent residents and faculty across varied
        sites who hand students real responsibility. Students rotate through **Ronald Reagan UCLA Medical
        Center**, Santa Monica–UCLA, **Harbor-UCLA**, **Olive View–UCLA**, and the West Los Angeles VA.
      - >-
        The county hospitals at Harbor and Olive View add safety-net experience to UCLA's academic
        flagship.

  - title: Culture
    icon: groups
    paragraphs:
      - >-
        The class is large, with diverse interests. Tim describes a supportive, friendly culture that also
        lets students keep some distance from day-to-day school life if they prefer.
      - >-
        Students see classmates most in the first two years; during clinical years, mostly in passing at
        the hospital.

  - title: Admissions
    icon: how_to_reg
    paragraphs:
      - >-
        UCLA weighs the undergraduate record, MCAT, letters, life experiences, and interviews, and requires
        AAMC PREview scores for traditional MD track applicants. Interviews are virtual for the 2026–2027
        cycle.
      - >-
        Tim's advice: pursue non-medical interests before medical school, because it can be all-consuming.

highlight_sources:
