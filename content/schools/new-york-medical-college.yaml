highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Nick Bacher describes a first year of daytime labs and lectures, then a more self-directed second
        year with lab sessions and group exercises two or three days a week. Hands-on clinical training
        begins in the second half of second year.
      - >-
        Nick credits NYMC's **standardized patients**, interviewed throughout the first two years, as the
        biggest help in building clinical skills, alongside first- and second-year preceptorships.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        Clerkships run from **Westchester Medical Center**, which shares the Valhalla campus, to **NYC
        Health + Hospitals/Metropolitan** in East Harlem, across about 30 clinical affiliates.
      - >-
        The mix spans an academic medical center and children's hospital in the suburbs and a city
        safety-net hospital in Manhattan.

  - title: Community
    icon: groups
    paragraphs:
      - >-
        Nick chose NYMC for its community feel. Student-launched traditions like **Friendsgiving** bring
        all four classes together for small-group potluck dinners and a student appreciation ceremony.
      - >-
        Nick pushes back on the idea that graded preclinical courses make a school competitive, saying
        that has never been the case at NYMC.

  - title: Westchester Location
    icon: train
    paragraphs:
      - >-
        Campus sits in suburban Westchester County. It isn't walkable, but nearby towns are a short drive
        away and Manhattan is just over half an hour by train.
      - >-
        Nick likes being able to head into the city after an exam.

