    "I like how involved the professors are with all of us. If anyone gets a subpar test grade, they reach
    out via email to schedule a meeting and set up tutoring. Touro is extremely proactive about giving
    people help when they need it."
  wei-ming-liang: >-
    "Each student gets an upperclassman as a mentor the minute they begin their first year, as well as a
    faculty advisor. These mentors have been instrumental in providing guidance, support, and advice
    throughout my journey in medical school."

