highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Touro uses a **flipped classroom**: students watch lecture videos beforehand, then answer clicker
        questions built on clinical vignettes in class. Brittany Stelmar describes mornings of lecture
        and afternoons of OMM, pathology, anatomy, histology, and neuro labs.
      - >-
        Brittany finds the video load heavy at times; Wei Ming Liang notes preclinical courses are graded
        on a z-score scale and that recorded lectures are available.

  - title: Osteopathic Training
    icon: back_hand
    paragraphs:
      - >-
        **Osteopathic manipulative medicine** runs alongside the science courses. Students diagnose and
        treat each other in lab, and Wei Ming says it sharpened palpation skills and anatomy knowledge.
      - >-
        Brittany calls OMM one of the most hands-on classes, and a tool worth carrying into practice.

  - title: Two New York Campuses
    icon: location_city
    paragraphs:
      - >-
        TouroCOM has campuses in **Harlem** and in **Middletown**, about an hour north of New York City,
        plus a campus in Great Falls, Montana. Middletown rotations lean on the Hudson Valley, anchored by
        Garnet Health Medical Center minutes from campus; Harlem rotations are mostly across New York City.
      - >-
        Brittany likes Middletown's balance: a small town with few distractions and an easy train or bus
        into the city. Wei Ming enjoys Harlem's restaurants, gyms, and climbing nearby.

  - title: Support & Service
    icon: volunteer_activism
    paragraphs:
      - >-
        Every student gets an upperclass mentor and a faculty advisor from the first day. Brittany says
        professors reach out after a weak exam to set up tutoring.
      - >-
        Students run health fairs, including a biannual fair in Harlem, and mentor local high school
        students through **MedAchieve**.

