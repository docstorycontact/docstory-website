highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Hopkins teaches through **Genes to Society**, a systems-based model that frames disease through
        genetics, behavior, environment, and society rather than a simple normal-versus-abnormal split.
        Its core organ-system course runs about fifteen months, and all pre-clerkship courses are
        pass/fail.
      - >-
        Will Tobolowsky describes days of three to six lectures plus small groups and virtual
        microscopy, with each course taught in a focused block of a few weeks. One afternoon a week
        goes to an outpatient clinic through the **Longitudinal Ambulatory Clerkship**, which pairs
        students with a faculty preceptor from year one.

  - title: Research & Degrees
    icon: science
    paragraphs:
      - >-
        Roughly 10% of Hopkins medical students pursue a combined **MD-PhD**, and the school also offers
        MD-MPH, MD-MBA, and MD-MS in Health Care Management degrees.
      - >-
        Will's advice is to pick what to engage with: there are, he says, "way more opportunities than
        time," from research to student groups, so it pays to choose a few and stick with them.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        Students train at **The Johns Hopkins Hospital** in East Baltimore and at **Johns Hopkins
        Bayview Medical Center** in Highlandtown, a major teaching, clinical, and research campus. An
        early course on health disparities introduces East Baltimore through service learning.
      - >-
        Will argues the setting is part of the education: hospitals in underserved areas see serious
        emergencies and complex cases, and that is often where help is needed most.

  - title: Life & Affordability
    icon: savings
    paragraphs:
      - >-
        Since fall 2024, Hopkins covers the **full cost of attendance** for medical students from
        families earning under $175,000, and tuition for families under $300,000, with assets also
        considered.
      - >-
        Will is candid about East Baltimore: crime and few walkable food options near campus, but great
        dining and nightlife within a short drive. Student life runs from an annual Olympics to Friday
        socials, with more events than time to attend them.

