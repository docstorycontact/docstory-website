# ─────────────────────────────────────────────────────────────────────────────
# School page data — copy this file to content/schools/<school-slug>.yaml
# (the slug must match the folder name in content/interviews/ and the key in
# SCHOOLS inside build_schools.py), fill in what you have, then run:
#
#     python3 fetch_nih_funding.py     # optional: refresh the automatic NIH figure
#     python3 build_schools.py
#
# Having this file turns on the full page (stats dashboard + Program Highlights).
# Every field is optional — leave out anything without an official source and that
# tile is hidden.
#
# SOURCING RULES
#   • Numbers: only from the school's own website (class profile, cost of attendance,
#     facts pages) or U.S. government data. Put a comment after each number naming
#     the page, and list every page under `sources`.
#   • Highlights: write in your own words from DocStory interviews plus facts confirmed
#     on official pages. Don't copy text from other sites. List the pages under
#     `highlight_sources`.
#   • Avoid SDN, AAMC/MSAR tables, U.S. News and similar databases unless you have
#     permission — their terms restrict reuse.
# ─────────────────────────────────────────────────────────────────────────────

short_name: Keck                 # used in "N interviews from current and former <short_name> students"
location_line: Orange County, CA # optional — replaces "City, ST" in the line under the school name
nih_org: UNIVERSITY OF SOUTHERN CALIFORNIA   # name exactly as NIH RePORTER spells it (automatic NIH funding)

stats:
  # Selectivity — from the school's class profile
  entering_class: 2026
  stats_kind: median             # "median" or "average", whichever the school publishes
  profile_url: https://...       # adds an "Official class profile" link to the dashboard
  mcat: 516
  gpa_science: 3.85
  gpa_overall: 3.87

  # Admissions funnel — any subset; bars appear for the ones given
  applied: 7,874
  interviewed: 757
  admitted: 215                  # offers of admission → shows "% of applicants admitted"
  enrolled: 125
  acceptance_rate: 3.34%         # if the school states it directly (wins over computed %)

  # Class profile
  class_size: 125                # also replaces the class size in the hero line
  women_pct: 52
  out_of_state_pct: 9
  total_students: 523

  # Cost — EITHER `tuition` (one rate) OR in-state + out-of-state. Whole dollars.
  tuition: 76640
  # tuition_in_state: 52168
  # tuition_out_of_state: 64413
  cost_year: 2026–27
  total_cost: 469617             # sum of the four yearly cost-of-attendance budgets
  total_cost_note: California resident, off campus

  # Scale & reach (NIH funding is added automatically when nih_org is set)
  faculty: 2,128
  faculty_label: Faculty Members
  beds: 456
  beds_label: Beds · UCI Medical Center
  nih_label: NIH funding · FY{year}   # optional custom caption; {year} = fiscal year

sources:
  - label: UCI MD Admissions (class profile)
    url: https://...

# Program Highlights — four cards read best (2×2 grid). **double asterisks** make bold text.
# Icons are Material Symbols names: https://fonts.google.com/icons
highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        First paragraph. Lines can wrap freely inside a ">-" block.
      - >-
        Second paragraph.

highlight_sources:
  - label: DocStory interview with <student>
    url: /interviews/<school-slug>/<student-file-name>/index.html
  - label: <School> MD Curriculum
    url: https://...

# Featured quote per interview, keyed by the interview's file name (without .md).
# Order here sets card order. Interviews not listed get an automatic excerpt.
quotes:
  student-file-name: >-
    "A quote from the interview."

# ── Extra dashboard sections ─────────────────────────────────────────────────
# Shown by default: selectivity, cost (+ rent) and scale & reach.
# Toggle 1 "Clinical training & research": clinical sites + research depth.
# Toggle 2 "Programs, admissions & outcomes": programs, applying, outcomes.

trials_sponsor: University of California, Irvine   # ClinicalTrials.gov sponsor name → automatic count
trials_label: led by HMS itself                    # optional caveat shown after the count

clinical_sites:                  # from the school's own clinical/affiliates page; first 6 shown in full
  - {name: UCI Medical Center, role: Principal teaching hospital · Level I trauma, cms_id: "050348"}
  - {name: Children's Hospital of Orange County, cms_id: "053304"}   # cms_id → Medicare type/ER/stars (automatic)
  - {name: UCI Family Health Center – Santa Ana, role: Federally qualified health center}
  # Quote any value that contains a comma:  role: "Children's, women's and maternity care"

research_badges:                 # official designations; text before " · " shows on the chip
  - NCI Comprehensive Cancer Center · Chao Family Comprehensive Cancer Center
  # NIH-funded MD-PhD (MSTP) and NIH CTSA hub badges are added automatically from NIH RePORTER

programs:
  tracks:
    - {name: PRIME-LC, note: Latino community health}
  dual_degrees: [MD/PhD (MSTP), MD/MBA, MD/MPH]

applying:                        # short label/value facts from the school's admissions pages
  - {label: Interviews, value: "Virtual · two 30–45 min interviews"}
  - {label: MCAT, value: "506+ to be invited to the secondary"}

outcomes:                        # only what the school publishes
  match_rate: 97.4%
  match_year: 2025
  avg_debt: 119656
  avg_debt_note: "national avg ~$191K public / ~$199K private"
  avg_scholarship: 65442
  aid_pct: 71

cost_of_living:                  # shown inside the Cost of Attendance cell
  county: Orange County, CA
  fips: "06059"                  # 5-digit county FIPS; automatic with CENSUS_API_KEY
  median_rent: 2434              # Census QuickFacts "Median gross rent" until the key is set
  acs_year: 2020–2024
