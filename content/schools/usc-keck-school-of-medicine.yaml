quotes:
  dominic-carusillo: >-
    "I think shadowing has been the most valuable extracurricular thing I've done so far. There are
    so many resources and opportunities to see really cool specialties, and as a med student,
    attendings are very excited to show you all the cool things they do."
  sam-teles: >-
    "Being able to see patients at County is special because these are people who are grateful for
    your help and for someone that will listen to them. You don't get that as much at private
    hospitals. Being able to make a difference with people at County simply by paying attention to
    them is special."

