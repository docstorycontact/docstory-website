highlights:
  - title: Symptoms-Based Curriculum
    icon: menu_book
    paragraphs:
      - >-
        CCOM organizes the preclinical years around a weekly symptom rather than organ systems alone. Dani
        Sychowski describes weeks where the symptom ties together lectures, anatomy, osteopathic
        manipulative medicine, and the physical exam lab, though not every week lines up that neatly.
      - >-
        Dani notes that lectures are optional, recorded, and posted within hours, and that courses are
        letter-graded, with a few pass/fail exceptions.

  - title: Early Clinical Exposure
    icon: stethoscope
    paragraphs:
      - >-
        The mandatory **Early Clinical Contact Program** places first- and second-years with a preceptor,
        where students write SOAP notes and get physician feedback. Students can also volunteer in local
        community health clinics and a student-run OMM clinic on campus.
      - >-
        Third- and fourth-year core rotations, including family medicine, internal medicine, surgery,
        pediatrics, psychiatry, and OB/GYN, take place at approved affiliated sites around Chicago.

  - title: Class Culture
    icon: groups
    paragraphs:
      - >-
        Classes are large, around 200 students, but Dani has never felt cut-throat competition. Classmates
        share notes and mnemonics in group chats, and a big-little program pairs each first-year with a
        second-year.
      - >-
        With dozens of student organizations, from wilderness medicine to food as medicine, Dani says it’s
        easy to find your people.

  - title: Downers Grove
    icon: park
    paragraphs:
      - >-
        The campus is in **Downers Grove**, a western suburb, with Chicago an easy drive or train ride away.
        It backs onto the Lyman Woods forest preserve, with a trail gate right on campus.
      - >-
        Dani lives on campus in the student dorms and notes the suburbs offer restaurants, a Saturday farmers
        market, and Naperville close by.

