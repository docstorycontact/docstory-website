highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Courses run in focused blocks rather than semesters, so exams come often and material arrives
        fast. Prithwijit Roychowdhury found the faculty, many of them practicing clinicians, unusually
        invested in students they see as future colleagues.
      - >-
        Prithwijit's routine is built around afternoon classes and labs bracketed by daily spaced-repetition
        review. The advice Prithwijit would give a younger self: start that habit much earlier.

  - title: Three Ways to Train
    icon: alt_route
    paragraphs:
      - >-
        Most students train in **Worcester** with UMass Memorial Medical Center and community partners
        from Cape Cod to the Berkshires. The **PURCH** track focuses on urban and rural population health,
        with all core clerkships at Baystate Medical Center in Springfield.
      - >-
        **LEAD@Lahey**, which welcomed its first students in 2024 at a regional campus with Lahey Hospital
        & Medical Center in Burlington, emphasizes leadership, health systems science, and
        interprofessional education. The Class of 2030 includes 32 PURCH and 23 LEAD@Lahey students.

  - title: Culture
    icon: groups
    paragraphs:
      - >-
        Prithwijit describes a positive, supportive culture that starts on day one: first-year orientation
        is a camping trip run with second-years, and faculty join students at social events through the
        year.
      - >-
        Older students and faculty mentors are easy to reach for help with coursework, physical exam
        technique, or career advice.

  - title: Life in Worcester
    icon: location_city
    paragraphs:
      - >-
        Prithwijit calls Worcester "a gem of a city": distinct neighborhoods with new cafés, the
        restaurants and events of Shrewsbury Street, parks and small beaches, and plenty of young people
        from the area's many colleges.
      - >-
        The cost of living is low; the downsides, Prithwijit says, are limited public transit and a spread-out
        city.

