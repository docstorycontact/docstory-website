highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Catherine Boatman describes 8am lectures, recorded for anyone who prefers to watch later, with
        afternoons that rotate through Problem Based Learning and Physical Diagnosis. Catherine attends
        in person and builds Anki cards during lecture.
      - >-
        Physical Diagnosis starts in year one, building comfort with the physical exam well before the
        clinical years.

  - title: Academic Houses
    icon: groups
    paragraphs:
      - >-
        Every student is sorted into one of 13 **Academic Houses**: small apartments on the medical
        school's upper floors with kitchenettes, couches, TVs, and study space. Houses go on outings
        together, and the year ends with the **House Olympics**, where the winners keep the House Cup.
      - >-
        Catherine counts the house system among the leading reasons for choosing MCG, and calls the
        faculty and staff incredibly supportive.

  - title: Statewide Training
    icon: map
    paragraphs:
      - >-
        Beyond Augusta, MCG trains students across Georgia, with more than 350 urban and rural clinical
        sites. Regional campuses include Albany (Phoebe Putney Memorial Hospital), Rome and Dalton,
        Savannah and Brunswick, and **MCG Atlanta** at Wellstar Kennestone Regional Medical Center.
      - >-
        A four-year campus in **Savannah**, run with Georgia Southern University, opened in 2024 and
        brought the entering class to about 300.

  - title: Service
    icon: volunteer_activism
    paragraphs:
      - >-
        Once they have their white coats, students can volunteer in free student-run clinics, including a
        Mental Health Clinic, a Women's Clinic, a Pediatric Clinic, and an LGBTQ Equality Clinic.
        Catherine says most students participate in a clinic.
      - >-
        Shadowing opportunities are readily available from first year.

highlight_sources:
