highlights:
  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Allison Martin describes covering a college semester's worth of material every six weeks; at that
        pace, students quickly find their own method. Allison stopped attending lecture and learns by
        listening and reading, while classmates lean on notes, textbooks, or spaced repetition.
      - >-
        Drew Weinstein keeps a tighter schedule: previewing in the library before 8am, lectures until noon,
        afternoons of anatomy or required sessions, then evenings of daily review, because "you cannot
        cram."

  - title: Clinical Training Across Chicagoland
    icon: local_hospital
    paragraphs:
      - >-
        Chicago Medical School doesn't own a hospital; students rotate across a wide network instead,
        including Level 1 trauma rotations, suburban and rural community clinics, and the **Captain James
        A. Lovell Federal Health Care Center**, a combined VA and military hospital next to campus.
      - >-
        Allison sees that as a plus: rotating through most of Chicagoland's hospitals and many small
        clinics exposes students to a wide range of settings. Sites include Advocate Christ, Advocate
        Lutheran General, Mount Sinai, and Cook County's Stroger Hospital.

  - title: Student Culture
    icon: groups
    paragraphs:
      - >-
        Allison describes classmates who all have something going on, from student council to research,
        and who show up for each other's fundraisers and talks. The faculty care, the administration
        listens, and students have a real voice.
      - >-
        Drew points to interest groups for every major specialty, plenty of intramural sports, and
        volunteer organizations serving the surrounding community.

  - title: Location
    icon: train
    paragraphs:
      - >-
        The first two years are in quiet **North Chicago**: restaurants, gyms, and shopping for the
        essentials, and few distractions from studying. The city is about 45 minutes away by train for
        weekends.
      - >-
        For the clinical years, everybody moves down to Chicago itself, which Drew calls "awesome."

