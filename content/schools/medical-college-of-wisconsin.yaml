highlights:
  - title: Three Campuses
    icon: map
    paragraphs:
      - >-
        **MCW-Milwaukee** offers a four-year curriculum with scholarly pathways in areas such as community
        health and bioethics. **MCW-Green Bay** and **MCW-Central Wisconsin** offer a calendar-efficient
        three-year curriculum emphasizing primary care, general surgery, or psychiatry.
      - >-
        Wisconsin residents receive an estimated $3,450 in state tuition assistance each year.

  - title: Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Austin Dopp spends mornings in recorded lectures and afternoons studying or on research projects.
        With few graded assignments, grades rest mostly on exams, and Austin found that understanding why
        things happen beats rote memorization.
      - >-
        Austin values MCW's drive to keep improving, and its **Kern Institute**, an education unit focused on
        character, competence, and caring, which also runs a Health Equity Scholars track.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        **Froedtert Hospital**, MCW's primary adult teaching affiliate, shares a campus with **Children's
        Wisconsin**, the state's oldest and largest children's hospital, connected by walkways. The
        Clement J. Zablocki VA Medical Center gives students the chance to care for veterans.
      - >-
        Psychiatry rotations, for example, also reach Rogers Hospital and Milwaukee County Behavioral
        Health.

  - title: Culture & Life
    icon: groups
    paragraphs:
      - >-
        In a class of around 200, Austin has never felt overlooked: classmates share study tips and remind
        each other of deadlines.
      - >-
        As a parent of three, Austin appreciates a campus area that feels safe even late at night, and
        recorded lectures that make room for family.

