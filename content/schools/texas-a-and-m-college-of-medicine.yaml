highlights:
  - title: Four Campus Tracks
    icon: map
    paragraphs:
      - >-
        Every student starts with an 18-month pre-clerkship phase, and the class of about 200 is spread
        across campus tracks for clerkships: **Bryan–College Station** (with the AIM longitudinal integrated
        curriculum), **Dallas**, **Round Rock**, and **Houston**.
      - >-
        The college was renamed the Naresh K. Vashisht College of Medicine in August 2025, after a gift that
        funds full-tuition scholarships, research, and the Rural Medicine Program.

  - title: EnMed in Houston
    icon: precision_manufacturing
    paragraphs:
      - >-
        **EnMed** is a fully integrated engineering and medicine track based in the Texas Medical Center
        for all four years. Students earn an MD and a Master of Engineering, in partnership with Houston
        Methodist.
      - >-
        Caleb, an EnMed student, describes a small cohort of 34, a flipped classroom with faculty-led
        discussions and team-based learning, and a cap of 15 mandatory hours a week in pre-clerkship.

  - title: A School That Listens
    icon: forum
    paragraphs:
      - >-
        Caleb calls the program incredibly responsive to student feedback. Students sit on curriculum
        committees, and their proposals moved pre-clerkship to true pass/fail and unranked, cut mandatory
        sessions, and reworked courses.
      - >-
        Caleb describes Practice of Medicine courses that build the physical exam, clinical reasoning with standardized
        patients, and weekly half-day preceptorships before clerkships.

  - title: Life in Houston
    icon: location_city
    paragraphs:
      - >-
        For EnMed students, Houston offers nightlife, parks, museums, world-class food, and baseball. Caleb
        bikes to the hospital and parks free in the medical center.
      - >-
        The downsides Caleb lists: no hills to climb, horrible traffic, and a city that isn’t very walkable
        outside the medical center area.

