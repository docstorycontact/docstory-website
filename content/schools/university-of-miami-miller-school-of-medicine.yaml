highlights:
  - title: NextGenMD Curriculum
    icon: menu_book
    paragraphs:
      - >-
        Phase 1 is 14 months of foundational science taught through symptom-based cases, followed by four
        12-week integrated clerkships. Zach Donato describes daily pre-learning, morning lectures, and
        faculty-led small-group cases, with clerkships starting in the second year.
      - >-
        Zach says early clerkships make it easier to connect book knowledge to real patients.

  - title: Clinical Training
    icon: local_hospital
    paragraphs:
      - >-
        Students train across **Jackson Memorial Hospital**, the University of Miami Health System
        (including **UHealth Tower**), and the Miami VA Medical Center, plus the **Sylvester Comprehensive
        Cancer Center**, an NCI-designated Comprehensive Cancer Center.
      - >-
        Todd Jackson calls the breadth of diversity the school's biggest strength: students learn to care
        for some of the most disadvantaged, at-risk populations in the country.

  - title: Service
    icon: volunteer_activism
    paragraphs:
      - >-
        The student-run **DOCS** clinic hosts monthly health fairs in underserved neighborhoods, and Zach
        says more than 70% of students take part, many going on to lead stations.
      - >-
        Each year medical students take on UM law students in the **Dean's Cup**, from flag football to
        baking contests.

  - title: Life in Miami
    icon: beach_access
    paragraphs:
      - >-
        Most students live in Brickell or Downtown. Zach compares Brickell to a mini New York City; Todd
        points to concerts, Cuban and Haitian food, and the beach.
      - >-
        The downsides they mention: summer humidity, hurricane season, Brickell traffic, and a high cost of
        living.

